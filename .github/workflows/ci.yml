name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build example app
        working-directory: Examples/BasicSwiftApp
        run: swift build
